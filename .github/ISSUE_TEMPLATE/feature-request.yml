name: 功能或方法建议
description: 提议新功能、方法改进、使用场景或资源节省方案
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出能被验证的改进建议。无需写完整方案，但请说清问题、建议和成功标准。

        **安全漏洞不要在公开 Issue 中披露。** 请按照仓库根目录的 `SECURITY.md` 私密报告。

  - type: dropdown
    id: scenario
    attributes:
      label: 主要使用场景
      options:
        - 工程项目交付
        - AI 科研与实验
        - 两者通用
        - 文档、示例或易用性
        - 资料、授权或来源线索
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 目前遇到了什么限制？谁会在什么情况下受影响？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望增加或改变的功能、方法或工作流。
    validations:
      required: true

  - type: textarea
    id: success_criteria
    attributes:
      label: 可验证的成功标准
      description: 如何判断建议确实改善了结果、资源消耗或可靠性？可以给出指标、测试或验收示例。
      placeholder: 例如：在给定约束下通过哪些测试，或将哪项成本降低到什么范围。
    validations:
      required: true

  - type: textarea
    id: available_resources
    attributes:
      label: 可利用的现有资源与约束
      description: 可选。列出可复用工具、数据、代码、算力、时间限制或不能改变的条件；请勿提交保密材料。

  - type: textarea
    id: additional_context
    attributes:
      label: 补充材料
      description: 可选。添加公开链接、草图、对比方案或最小示例。

  - type: checkboxes
    id: public_information
    attributes:
      label: 公开信息确认
      options:
        - label: 我确认本 Issue 不包含凭据、个人信息、保密合同、未公开数据或其他不宜公开的内容。
          required: true
