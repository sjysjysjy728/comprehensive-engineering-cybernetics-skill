name: Release quality gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public Skill release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run validator self-tests
        run: python3 -X utf8 -I -B ci/validate_release.py --self-test

      - name: Validate, build, and revalidate deterministic archive
        run: |
          python3 -X utf8 -I -B ci/validate_release.py \
            --repo . \
            --skill . \
            --archive "${RUNNER_TEMP}/comprehensive-engineering-cybernetics.zip"
